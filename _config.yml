title:       "Follow or Bounce"
description: "Personal site of D.V. — writing on technology and consciousness, reference tools, and Follow or Bounce, a studio for AI, agentic systems, and the web."
author:      "D.V."
byline:      "Follow or Bounce"
studio:      "Follow or Bounce"
email:       "followorbounce@gmail.com"

baseurl: ""
url:     "https://followorbounce.com"

theme: ~

markdown:  kramdown
permalink: pretty

sass:
  sass_dir: _sass
  style:    compressed

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - arc/
  - .vscode/
  - .gitignore
  - "*.swp"
  - "*.swo"

established: "2024"

navigation:
  - title: "Work"
    url:   "/work/"
  - title: "Writing"
    url:   "/writing/"
  - title: "Interests"
    url:   "/interests/"
  - title: "Offers"
    url:   "/offers/"
  - title: "Contact ↗"
    url:   "/contact/"
    action: true

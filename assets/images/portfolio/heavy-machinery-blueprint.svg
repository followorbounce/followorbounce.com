<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c10"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1536" height="1024" fill="url(#bg)"/>
  <rect width="1536" height="1024" fill="url(#glow1)"/>
  <rect width="1536" height="1024" fill="url(#glow2)"/>

  <g stroke="rgba(0,210,255,0.05)" stroke-width="1">
    <line x1="0" y1="128" x2="1536" y2="128"/>
    <line x1="0" y1="256" x2="1536" y2="256"/>
    <line x1="0" y1="384" x2="1536" y2="384"/>
    <line x1="0" y1="512" x2="1536" y2="512"/>
    <line x1="0" y1="640" x2="1536" y2="640"/>
    <line x1="0" y1="768" x2="1536" y2="768"/>
    <line x1="0" y1="896" x2="1536" y2="896"/>
    <line x1="192" y1="0" x2="192" y2="1024"/>
    <line x1="384" y1="0" x2="384" y2="1024"/>
    <line x1="576" y1="0" x2="576" y2="1024"/>
    <line x1="768" y1="0" x2="768" y2="1024"/>
    <line x1="960" y1="0" x2="960" y2="1024"/>
    <line x1="1152" y1="0" x2="1152" y2="1024"/>
    <line x1="1344" y1="0" x2="1344" y2="1024"/>
  </g>

  <!-- Top label -->
  <text x="80" y="80" font-family="'Courier New', monospace" font-size="14" fill="rgba(0,210,255,0.6)" letter-spacing="6">ENGINEERING FIELD GUIDE · SCALE COMPARISON</text>
  <line x1="80" y1="92" x2="600" y2="92" stroke="rgba(0,210,255,0.2)" stroke-width="1"/>

  <!-- Main title -->
  <text x="80" y="230" font-family="Arial Black, Arial, sans-serif" font-size="88" font-weight="900" fill="white" letter-spacing="-2" opacity="0.96">HEAVY MACHINERY</text>
  <text x="80" y="330" font-family="Arial Black, Arial, sans-serif" font-size="88" font-weight="900" fill="url(#accentGrad)" letter-spacing="-2">THE BLUEPRINT</text>

  <!-- Subtitle tag -->
  <rect x="80" y="365" width="460" height="40" rx="20" fill="rgba(0,210,255,0.1)" stroke="rgba(0,210,255,0.3)" stroke-width="1"/>
  <text x="310" y="390" font-family="'Courier New', monospace" font-size="13" fill="#00d2ff" text-anchor="middle" letter-spacing="3">HEIGHT · WEIGHT · POWER · CAPACITY</text>

  <!-- Blueprint excavator schematic, right side -->
  <g transform="translate(920,470)" fill="none" stroke="rgba(0,210,255,0.55)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-40" y="140" width="420" height="34" fill="rgba(0,210,255,0.06)" stroke="rgba(0,210,255,0.35)"/>
    <circle cx="0" cy="174" r="26" fill="none"/>
    <circle cx="80" cy="174" r="26" fill="none"/>
    <circle cx="260" cy="174" r="26" fill="none"/>
    <circle cx="340" cy="174" r="26" fill="none"/>
    <rect x="40" y="60" width="200" height="90" rx="8" fill="rgba(0,255,136,0.05)" stroke="rgba(0,255,136,0.4)"/>
    <rect x="60" y="80" width="70" height="45" fill="none" stroke="rgba(0,255,136,0.5)"/>
    <polyline points="220,90 350,-40 470,10"/>
    <polyline points="470,10 540,120"/>
    <polygon points="520,100 580,100 566,150 512,145" fill="rgba(0,210,255,0.08)"/>
  </g>

  <!-- Dimension line + human figure for scale, echoing per-machine scale diagrams -->
  <g transform="translate(870,410)">
    <line x1="0" y1="0" x2="0" y2="264" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
    <line x1="-8" y1="264" x2="8" y2="264" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
    <circle cx="0" cy="234" r="8" fill="rgba(255,255,255,0.55)"/>
    <rect x="-6" y="244" width="12" height="30" rx="3" fill="rgba(255,255,255,0.55)"/>
    <text x="22" y="130" font-family="'Courier New', monospace" font-size="15" fill="rgba(255,255,255,0.6)">≈ 6×</text>
  </g>

  <!-- Bottom bar -->
  <line x1="80" y1="900" x2="1456" y2="900" stroke="rgba(0,210,255,0.1)" stroke-width="1"/>
  <text x="80" y="940" font-family="'Courier New', monospace" font-size="13" fill="rgba(0,210,255,0.4)" letter-spacing="2">20 REAL MACHINES · EVERY FIGURE, HUMAN SCALE</text>
  <text x="1456" y="940" font-family="'Courier New', monospace" font-size="13" fill="rgba(0,210,255,0.3)" text-anchor="end" letter-spacing="1">followorbounce.github.io/heavy-machinery-blueprint</text>

  <!-- Corner accent -->
  <rect x="0" y="0" width="4" height="1024" fill="url(#accentGrad)"/>
</svg>
